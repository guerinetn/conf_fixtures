services:
  conf-fix:
    build:
      context: .
      target: dev
    restart: unless-stopped
    volumes:
      - ./node_modules:/usr/share/nginx/html/node_modules
      - ./slides/highlight:/usr/share/nginnx/html/highlight
      - ./slides/images:/usr/share/nginx/html/images/:ro
      - ./slides/css:/usr/share/nginx/html/css/:ro
      - ./slides/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "9577:80"
